name: Terraform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  terraform:
    name: Lint & Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9"

      - name: Terraform Format
        run: terraform fmt -check

      - name: Terraform Init
        run: terraform init -backend=false

      # No standalone `terraform validate` step: it cannot evaluate
      # `for_each` in dynamic blocks when variables are unknown (a core
      # Terraform limitation). `terraform plan` below performs full
      # validation with concrete values.

      - name: Terraform Plan
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
        run: |
          terraform plan \
            -var="container_image=${{ secrets.CONTAINER_IMAGE }}" \
            -var="neon_connection_string=${{ secrets.NEON_CONNECTION_STRING }}" \
            -var="payload_secret=${{ secrets.PAYLOAD_SECRET }}" \
            -var="nextauth_url=${{ secrets.NEXTAUTH_URL }}" \
            -var="nextauth_secret=${{ secrets.NEXTAUTH_SECRET }}" \
            -var="ghcr_enabled=${{ vars.GHCR_ENABLED }}" \
            -out=tfplan
